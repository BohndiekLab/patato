[build-system]
requires = ["setuptools>=45", "setuptools_scm[toml]>=6.2", "wheel", "pybind11"]
build-backend = "setuptools.build_meta"

[project]
name = "patato"
dynamic = ["version"]
dependencies = [
    "cython>=3.1.3",
    "shapely>=2.1.1",
    "pylops>=2.2.0", # Check version compatibility with pylops
    "h5py>=3.14.0",
    "pandas>=2.3.1",
    "xarray>=2025.6.1",
    "numpy>=1.22",
    "scipy>=1.15.3",
    "matplotlib>=3.10.5",
    "matplotlib_scalebar>=0.9.0",
    "dask>=2025.7.0",
    "pybind11>=3.0.0",
    "jax[cpu]>=0.4.13",
    "customtkinter>=5.2.2",
    "tqdm>=4.67.1",
]

authors = [
  { name="Thomas Else", email="telse@ic.ac.uk" },
]
description = "A Python Toolkit for the analysis of photoacoustic tomography data."
readme = "README.md"
requires-python = ">=3.10,<3.14"

keywords = [
    "photoacoustics",
    "jax",
    "tomography",
    "reconstruction",
    "spectral unmixing",
    "dynamic contrast enhanced",
    "backprojection",
    "model based"
]

license = { file = "LICENSE.MD", name = "MIT" }

classifiers = [
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/bohndieklab/patato"
"Bug Tracker" = "https://github.com/bohndieklab/patato/issues"
"Documentation" = "https://patato.readthedocs.io"

[tool.setuptools.packages.find]
# All the following settings are optional:
where = ["."]  # ["."] by default
include = ["patato", "patato.*"]  # ["*"] by default
exclude = []  # empty by default
namespaces = true  # true by default

[project.scripts]
patato-import-ithera = "patato.convenience_scripts.convert_binary_to_hdf5:main"
patato-set-speed-of-sound = "patato.convenience_scripts.tune_speed_of_sound:main"
patato-unmix = "patato.convenience_scripts.unmix:main"
patato-reconstruct = "patato.convenience_scripts.process_msot:main"
patato-analyse-dce = "patato.convenience_scripts.data_analysis.analyse_dce:main"
patato-analyse-gc = "patato.convenience_scripts.data_analysis.analyse_gas_challenge:main"
patato-convert-simpa = "patato.convenience_scripts.convert_simpa:main"
patato-draw-roi = "patato.convenience_scripts.draw_roi:main"

[tool.setuptools.package-data]
"*" = ["*.cu", "*.cl", "*.json", "*.csv", "*.txt", "*.png"]

[tool.setuptools.exclude-package-data]
"*" = [".gitattributes", ".gitignore"]

[tool.setuptools_scm]
write_to = "patato/_version.py"

[tool.cibuildwheel]
# Disable building PyPy wheels on all platforms
skip = "pp*"

[tool.uv]
# python-build-standalone only started bundling working tkinter/Tcl-Tk support
# in its August 2025 releases; older uv versions can silently resolve to an
# interpreter with no _tkinter extension at all, breaking the GUI scripts.
required-version = ">=0.8.7"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "ipython>=8.12.3",
    "ipywidgets>=8.1.7",
    "jupyterlab>=4.3.8",
    "myst-parser>=3.0.1",
    "nbsphinx>=0.9.7",
    "pandoc>=2.4",
    "pydata-sphinx-theme>=0.14.4",
    "sphinx>=6.2.1",
    "sphinx-book-theme>=1.0.1",
    "sphinx-rtd-theme>=3.0.2",
]
test = [
    "coverage>=7.6.1",
    "pytest>=8.3.5",
    "ruff>=0.6.4",
]
